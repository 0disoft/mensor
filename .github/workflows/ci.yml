name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-form-index:
    name: Capture FormIndex aggregate failure
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/public-form-index-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/public-form-index-v1
      - name: Detect existing diagnostic
        id: diagnostic
        shell: bash
        run: |
          if test -f ci-form-index-failure.log; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diagnostic.outputs.exists == 'false'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.11.0
          run_install: false
      - if: steps.diagnostic.outputs.exists == 'false'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.diagnostic.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile
      - name: Capture and commit aggregate output
        if: steps.diagnostic.outputs.exists == 'false'
        shell: bash
        run: |
          set +e
          pnpm run check > ci-form-index-failure.log 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> ci-form-index-failure.log
          git config user.name "ZeroDi"
          git config user.email "rodisoft1@gmail.com"
          git add ci-form-index-failure.log
          git commit -s -m "chore(ci): record FormIndex aggregate failure"
          git push origin HEAD:feat/public-form-index-v1
          exit 0

  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  docker-integration:
    name: Docker integration on ubuntu-latest
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docker-integration
