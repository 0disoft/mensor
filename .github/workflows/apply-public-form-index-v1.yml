name: Apply public FormIndex v1 branch patch

on:
  push:
    branches:
      - feat/public-form-index-v1
    paths:
      - scripts/form-index-payload.*.b64
      - .github/workflows/apply-public-form-index-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/form-index-payload.*.b64
      - .github/workflows/apply-public-form-index-v1.yml

permissions:
  contents: write

concurrency:
  group: apply-public-form-index-v1
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'feat(form-index): expose source-bound FormIndex v1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/public-form-index-v1
      - name: Materialize bounded source patch
        run: |
          cat scripts/form-index-payload.*.b64 > /tmp/form-index-payload.b64
          base64 --decode /tmp/form-index-payload.b64 | tar -xzf -
          python3 scripts/apply-public-form-index-v1.py
          rm scripts/apply-public-form-index-v1.py
          rm scripts/form-index-payload.*.b64
      - name: Verify patch shape
        run: |
          git diff --check
          test ! -e packages/compiler/src/form-index-types.ts
          test ! -e packages/compiler/src/form-index-validation.ts
          test -e packages/contract/spec/form-index-v1.schema.json
      - name: Commit implementation
        run: |
          git config user.name "ZeroDi"
          git config user.email "rodisoft1@gmail.com"
          git add -A
          git commit -s -m "feat(form-index): expose source-bound FormIndex v1"
          git push origin HEAD:feat/public-form-index-v1
