name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact workspace version to publish
        required: true
        type: string
      dist_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read

concurrency:
  group: mensor-npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Verify successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-ci.mjs
      - name: Install publishing npm CLI
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release input and repository
        run: pnpm run release-check -- --version "$RELEASE_VERSION" --tag "$RELEASE_TAG"
      - name: Run aggregate gate
        run: pnpm run check
      - name: Pack release artifacts
        run: pnpm run release:pack -- --version "$RELEASE_VERSION"
      - name: Publish contract package
        run: npm publish "./dist/release/0disoft-mensor-contract-${RELEASE_VERSION}.tgz" --tag "$RELEASE_TAG" --provenance
      - name: Publish compiler package
        run: npm publish "./dist/release/0disoft-mensor-compiler-${RELEASE_VERSION}.tgz" --tag "$RELEASE_TAG" --provenance
      - name: Publish CLI package
        run: npm publish "./dist/release/0disoft-mensor-cli-${RELEASE_VERSION}.tgz" --tag "$RELEASE_TAG" --provenance
      - name: Publish reference runtime package
        run: npm publish "./dist/release/0disoft-mensor-reference-runtime-${RELEASE_VERSION}.tgz" --tag "$RELEASE_TAG" --provenance
