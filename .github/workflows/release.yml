name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact workspace version to stage
        required: true
        type: string
      dist_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      stage_reference_runtime:
        description: Stage the reference runtime (disable only for its one-time registry bootstrap)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mensor-npm-release
  cancel-in-progress: false

jobs:
  stage:
    name: Validate and stage npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release input and repository
        run: pnpm run release-check -- --version "${{ inputs.version }}" --tag "${{ inputs.dist_tag }}"
      - name: Run aggregate gate
        run: pnpm run check
      - name: Pack release artifacts
        run: pnpm run release:pack -- --version "${{ inputs.version }}"
      - name: Stage contract package
        run: npm stage publish "./dist/release/0disoft-mensor-contract-${{ inputs.version }}.tgz" --tag "${{ inputs.dist_tag }}"
      - name: Stage compiler package
        run: npm stage publish "./dist/release/0disoft-mensor-compiler-${{ inputs.version }}.tgz" --tag "${{ inputs.dist_tag }}"
      - name: Stage CLI package
        run: npm stage publish "./dist/release/0disoft-mensor-cli-${{ inputs.version }}.tgz" --tag "${{ inputs.dist_tag }}"
      - name: Stage reference runtime package
        if: inputs.stage_reference_runtime
        run: npm stage publish "./dist/release/0disoft-mensor-reference-runtime-${{ inputs.version }}.tgz" --tag "${{ inputs.dist_tag }}"
