name: Guarded RSVP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guarded-rsvp.yml'
      - 'examples/honox-guarded-rsvp/**'
      - 'packages/**'
      - 'internal/agent-runner/oracles/honox-rsvp-v1.test.mjs'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '.github/workflows/guarded-rsvp.yml'
      - 'examples/honox-guarded-rsvp/**'
      - 'packages/**'
      - 'internal/agent-runner/oracles/honox-rsvp-v1.test.mjs'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-rsvp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/honox-guarded-rsvp
      - run: npm run check
        working-directory: examples/honox-guarded-rsvp
      - run: npm test
        working-directory: examples/honox-guarded-rsvp
